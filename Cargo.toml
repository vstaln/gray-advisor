[package]
name = "gray-advisor"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Second-opinion advisor: /advise sends the question + session digest to a configured model and returns its take"

[lib]
name = "gray_advisor"
path = "src/lib.rs"

[[bin]]
name = "gray-advisor"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
